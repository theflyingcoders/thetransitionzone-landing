# Example durability timeline. The paddle name and average lifespan come from paddles.yaml.
paddle: joola
purchased: Feb 2024
owners: 89
start: 6   # slider start month
points:
  - month: 3
    title: '"Still feels brand new"'
    detail: 82% of owners. Power and touch unchanged.
